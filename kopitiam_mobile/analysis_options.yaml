include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Callback builder memakai (_, __) untuk membedakan dua parameter yang
    # memang diwajibkan API Flutter tetapi tidak digunakan.
    unnecessary_underscores: false
