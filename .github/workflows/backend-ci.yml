name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'kopitiam_backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'kopitiam_backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  syntax-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kopitiam_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kopitiam_backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: JavaScript syntax
        run: npm run check 2>&1 | tee backend-check.log
      - name: Backend regression tests
        run: npm test 2>&1 | tee backend-test.log
      - name: Report failure details
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## Backend CI gagal'; echo '```text'; tail -n 120 backend-check.log 2>/dev/null || true; tail -n 160 backend-test.log 2>/dev/null || true; echo '```'; } > failure.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file failure.md
