name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'simandist_backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'simandist_backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  syntax-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: simandist_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simandist_backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: JavaScript syntax
        run: npm run check
      - name: Backend regression tests
        run: npm test
