name: Backend CI
on:
  push:
    branches: [main]
    paths: ['kopitiam_backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['kopitiam_backend/**', '.github/workflows/backend-ci.yml']
permissions:
  contents: read
  pull-requests: write
jobs:
  syntax-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kopitiam_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kopitiam_backend/package-lock.json
      - run: npm ci
      - name: Check and test
        shell: bash
        run: |
          set -o pipefail
          { npm run check && npm test; } 2>&1 | tee backend-result.log
      - name: Report failure
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## Backend CI detail'; echo '```text'; tail -n 180 backend-result.log; echo '```'; } > failure.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file failure.md
