name: Flutter CI

on:
  push:
    branches: [main]
    paths: ['kopitiam_mobile/**', '.github/workflows/flutter-ci.yml']
  pull_request:
    paths: ['kopitiam_mobile/**', '.github/workflows/flutter-ci.yml']

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kopitiam_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo 'CI analyzer gagal:'
              echo '```text'
              tail -n 80 analyze.log
              echo '```'
            } > analyze-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file analyze-comment.md
          fi
          exit "$code"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
