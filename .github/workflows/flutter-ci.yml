name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'simandist_mobile/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'simandist_mobile/**'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: write

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simandist_mobile

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get 2>&1 | tee ../flutter-ci.log

      - name: Formatting diagnostics
        if: always()
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test 2>&1 | tee -a ../flutter-ci.log

      - name: Analyzer diagnostics
        if: always()
        continue-on-error: true
        run: flutter analyze 2>&1 | tee -a ../flutter-ci.log

      - name: Test diagnostics
        if: always()
        continue-on-error: true
        run: flutter test 2>&1 | tee -a ../flutter-ci.log

      - name: Build debug APK
        if: always()
        id: apk
        run: flutter build apk --debug 2>&1 | tee -a ../flutter-ci.log

      - name: Save failure diagnostics
        if: failure() && github.event_name == 'pull_request'
        working-directory: .
        run: |
          mkdir -p ci
          tail -n 500 flutter-ci.log > ci/flutter-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/flutter-build.log
          git commit -m "chore: capture Flutter build diagnostics" || exit 0
          git push origin HEAD:${{ github.head_ref }}
