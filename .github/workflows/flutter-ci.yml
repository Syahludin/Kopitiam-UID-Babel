name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'simandist_mobile/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'simandist_mobile/**'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simandist_mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Formatting diagnostics
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug
